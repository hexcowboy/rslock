[package]

name = "rslock"
version = "0.10.0"
authors = [
  "Jan-Erik Rediger <badboy@archlinux.us>",
  "Romain Boces <bocesr@gmail.com>",
  "hexcowboy <hex@cowboy.dev",
]

keywords = ["distributed", "locking", "dls", "redis", "redlock"]
description = "Implementation of the distributed locking mechanism built on top of Async Redis"

homepage = "https://github.com/hexcowboy/redlock-async-rs"
repository = "https://github.com/hexcowboy/redlock-async-rs"

license = "BSD-3-Clause"
readme = "README.md"
edition = "2021"

[features]
async-std-comp = ["smol-comp"]
smol-comp = ["redis/smol-rustls-comp"]
tokio-comp = ["redis/tokio-rustls-comp"]
cluster = ["redis?/cluster-async"]
# By default, no async runtime support is enabled.
# Please enable `tokio-comp` or `smol-comp` depending on which your project is using.
default = []

[dependencies]
redis = { version = "1.8.0", optional = true, default-features = false, features = ["script"] }
tokio = { version = "1.54.1", features = ["sync"] }
rand = "0.10.3"
futures = "0.3.34"
futures-timer = "3.0.4"
thiserror = "2.0.21"

[dev-dependencies]
testcontainers = "0.28.0"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
smol = "2.0.2"

[[example]]
name = "cluster"
required-features = ["cluster", "tokio-comp"]

[[example]]
name = "basic"
required-features = ["tokio-comp"]

[[example]]
name = "from_clients"
required-features = ["tokio-comp"]

[[example]]
name = "shared_lock"
required-features = ["tokio-comp"]

[[example]]
name = "smol"
required-features = ["smol-comp"]
