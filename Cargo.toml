[package]

name = "rslock"
version = "0.8.0"
authors = [
  "Jan-Erik Rediger <badboy@archlinux.us>",
  "Romain Boces <bocesr@gmail.com>",
  "hexcowboy <hex@cowboy.dev",
]

keywords = ["distributed", "locking", "dls", "redis", "redlock"]
description = "Implementation of the distributed locking mechanism built on top of Async Redis"

homepage = "https://github.com/hexcowboy/redlock-async-rs"
repository = "https://github.com/hexcowboy/redlock-async-rs"

license = "BSD-3-Clause"
readme = "README.md"
edition = "2021"

[features]
# redis 1.x dropped async-std features; smol-rustls-comp is the non-Tokio async stack.
smol-rustls-comp = ["redis/smol-rustls-comp"]
tokio-comp = ["redis/tokio-rustls-comp"]
default = ["smol-rustls-comp"]

[dependencies]
redis = { version = "1.2.0" }
tokio = { version = "1.52.1", features = ["rt", "time"] }
rand = "0.10.1"
futures = "0.3.32"
thiserror = "2.0.18"

[dev-dependencies]
once_cell = "^1.21.3"
testcontainers = "^0.23.3"
anyhow = "^1.0.101"
tokio = { version = "^1.49.0", features = ["macros", "rt-multi-thread"] }
tokio-test = "^0.4.5"
